<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#123a63"><title>まじで結局どーなん？</title>
<style>
:root{--n:#123a63;--n2:#1d568b;--b:#2f7dc1;--bg:#f5f8fb;--ink:#17324d;--muted:#6c7d8f;--line:#dbe6ef;--w:#fff;--c:#168b68;--p:#d94b83;--d:#c93636}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}
.app{max-width:520px;margin:auto;min-height:100dvh}header{background:linear-gradient(135deg,var(--n),var(--n2));color:#fff;padding:17px 17px 15px;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px #123a632e}
.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:21px;font-weight:850}.date{font-size:12px;opacity:.85;margin-top:4px}.gear{width:42px;height:42px;border:0;border-radius:12px;background:#ffffff20;color:#fff;font-size:21px}
main{padding:14px 14px 90px}.screen{display:none}.screen.active{display:block}.card{background:var(--w);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px #123a6317}
.k{font-size:12px;color:var(--muted);font-weight:750}.big{font-size:36px;font-weight:900;color:var(--n);letter-spacing:-.03em;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.mini{background:#f7fafc;border-radius:13px;padding:10px}.mini label{display:block;font-size:11px;color:var(--muted)}.mini b{display:block;font-size:18px;margin-top:2px}.cash{color:var(--c)}.pay{color:var(--p)}
.note,.help{font-size:11px;color:var(--muted);line-height:1.55;margin-top:7px}.today{background:#eaf3fb;border-color:#cfe2f2}.today .big{font-size:34px}
.alert{margin-top:10px;background:#fff0f0;border:1px solid #efb8b8;color:var(--d);border-radius:13px;padding:9px 11px;font-size:12px;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.action{min-height:70px;border-radius:17px;color:#fff;font-weight:850;padding:12px;box-shadow:0 7px 18px #123a6320}.action small{display:block;font-size:11px;margin-top:4px;opacity:.9}.allow{background:var(--c)}.nec{background:#ef8a21}.income{background:var(--n)}.history{background:#6f8192}
.section{font-size:17px;font-weight:850;margin-bottom:10px}.formlabel{font-size:12px;color:var(--muted);font-weight:750;margin:14px 0 7px}.amount{width:100%;padding:13px;border:2px solid var(--line);border-radius:14px;font-size:28px;font-weight:850;color:var(--n)}input,select,button{font-size:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{padding:13px;border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:800}.opt.selc{border-color:var(--c);background:#effaf6}.opt.selp{border-color:var(--p);background:#fff1f6}.primary{width:100%;margin-top:16px;padding:15px;border:0;border-radius:15px;background:var(--n);color:#fff;font-weight:850}.secondary{width:100%;margin-top:9px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--n);font-weight:800}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.setting:last-child{border:0}.setting input{width:145px;text-align:right;border:1px solid var(--line);border-radius:10px;padding:8px}.badge{font-size:11px;font-weight:800;background:#edf3f8;color:var(--n);padding:4px 8px;border-radius:99px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 7px max(7px,env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:#fff;color:#718194;padding:5px;font-size:12px;font-weight:750}.nav button.on{color:var(--n)}.ico{display:block;font-size:19px;margin-bottom:1px}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.item:last-child{border:0}.meta{font-size:10px;color:var(--muted);margin-top:3px}.minus{color:var(--d);font-weight:850}.plus{color:var(--c);font-weight:850}
.toast{display:none;position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#17324d;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;z-index:30}
</style></head><body><div class="app">
<header><div class="head"><div><div id="ht" class="title">まじで結局どーなん？</div><div id="hd" class="date"></div></div><button id="ha" class="gear" onclick="openSettings()">⚙︎</button></div></header>
<main><section id="home" class="screen active"></section><section id="expense" class="screen"></section><section id="income" class="screen"></section><section id="settings" class="screen"></section><section id="history" class="screen"></section></main>
<nav class="nav"><button id="nh" class="on" onclick="show('home')"><span class="ico">⌂</span>ホーム</button><button id="nr" onclick="show('history')"><span class="ico">▤</span>履歴</button><button id="ns" onclick="openSettings()"><span class="ico">⚙︎</span>設定</button></nav></div><div id="toast" class="toast"></div>
<script>
const KEY="majide-kekkyoku-v1";
const y=n=>new Intl.NumberFormat("ja-JP").format(Math.round(n||0));
const td=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const mk=()=>td().slice(0,7);
const dim=()=>new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
const D=()=>dim()-new Date().getDate()+1;
const def=()=>({allowance:25000,necessary:23000,payNecessary:10000,cash:5000,paypay:34000,allowSpent:0,necCashSpent:0,necPaySpent:0,necAdjustTotal:0,necAdjustPay:0,events:[],day:td(),monthKey:mk(),monthStarted:true,baseTotal:null,baseCash:null,basePay:null,todayCashSpent:0,todayPaySpent:0});
let s=load(), purpose="allowance",method="cash",entryAmount="";
function load(){try{return Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return def()}}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function resetDay(){if(s.day!==td()){s.day=td();s.baseTotal=s.baseCash=s.basePay=null;s.todayCashSpent=s.todayPaySpent=0;save()}}
function ensureMonth(){
  if(!s.monthKey){s.monthKey=mk();s.monthStarted=true;save();return true}
  if(s.monthKey!==mk()&&!s.monthStarted){return false}
  if(s.monthKey!==mk()){
    s.monthStarted=false;
    s.pendingMonth=mk();
    s.pendingAllowance=s.allowance;s.pendingNecessary=s.necessary;s.pendingPayNecessary=s.payNecessary;
    save();return false;
  }
  return true;
}
function startNewMonth(){
  s.monthKey=mk();
  s.allowance=Number(document.getElementById("newA").value)||0;
  s.necessary=Number(document.getElementById("newN").value)||0;
  s.payNecessary=Number(document.getElementById("newP").value)||0;
  s.allowSpent=0;s.necCashSpent=0;s.necPaySpent=0;s.necAdjustTotal=0;s.necAdjustPay=0;
  s.day=td();s.baseTotal=s.baseCash=s.basePay=null;s.todayCashSpent=s.todayPaySpent=0;s.monthStarted=true;delete s.pendingMonth;delete s.pendingAllowance;delete s.pendingNecessary;delete s.pendingPayNecessary;save();home();
}
function monthGate(){
  if(ensureMonth())return true;
  const a=s.pendingAllowance??s.allowance,n=s.pendingNecessary??s.necessary,p=s.pendingPayNecessary??s.payNecessary;
  document.getElementById("home").innerHTML=`<div class="card"><div class="section">${new Date().getMonth()+1}月の設定</div><div class="help">新しい月になりました。先月の設定を引き継いでいます。変更がなければ、そのまま開始してください。</div><div class="setting"><span>小遣い予算</span><input id="newA" type="number" value="${a}"></div><div class="setting"><span>必要経費 合計</span><input id="newN" type="number" value="${n}"></div><div class="setting"><span>PayPay必要経費</span><input id="newP" type="number" value="${p}"></div><div class="help">今月の予算として、この内容でスタートします。</div><button class="primary" onclick="startNewMonth()">${new Date().getMonth()+1}月を開始する</button></div>`;
  document.getElementById("ht").textContent="まじで結局どーなん？";document.getElementById("hd").textContent="今月の設定が必要です";return false;
}
function necBaseTotal(){return s.necessary-s.necCashSpent-s.necPaySpent+s.necAdjustTotal}
function necBasePay(){return s.payNecessary-s.necPaySpent+s.necAdjustPay}
function necCashRemain(){return necBaseTotal()-necBasePay()}
function necPayRemain(){return necBasePay()}
function freeCash(){return s.cash-necCashRemain()}
function freePay(){return s.paypay-necPayRemain()}
function freeActual(){return freeCash()+freePay()}
function freeRemain(){return Math.min(s.allowance-s.allowSpent,freeActual())}
function setBase(){resetDay();if(s.baseTotal!==null)return;let r=D(), total=Math.floor(Math.max(0,freeRemain())/r),c=Math.floor(Math.max(0,freeCash())/r),p=Math.floor(Math.max(0,freePay())/r);let diff=total-c-p;if(diff>0){if(freePay()>=freeCash())p+=diff;else c+=diff}s.baseTotal=total;s.baseCash=c;s.basePay=p;save()}
function daily(){setBase();return{total:s.baseTotal-s.todayCashSpent-s.todayPaySpent,cash:s.baseCash-s.todayCashSpent,pay:s.basePay-s.todayPaySpent}}
function tomorrow(){let r=D()-1;return r>0?Math.floor(Math.max(0,freeRemain())/r):0}
function show(id){if(id!=="home"&&!monthGate())return;["home","expense","income","settings","history"].forEach(x=>document.getElementById(x).classList.remove("active"));document.getElementById(id).classList.add("active");["nh","nr","ns"].forEach(x=>document.getElementById(x).classList.remove("on"));document.getElementById({home:"nh",history:"nr",settings:"ns"}[id]||"nh").classList.add("on");document.getElementById("ha").style.display=(id==="home"||id==="history")?"block":"none";if(id==="home")home();if(id==="expense")entry("expense");if(id==="income")entry("income");if(id==="settings")settings();if(id==="history")history()}
function openSettings(){show("settings")}
function home(){if(!monthGate())return;resetDay();let d=daily(),f=freeRemain(),a=d.total<0?`<div class="alert">明日以降は1日 ¥${y(tomorrow())} になります。</div>`:"";let freeLeft=Math.max(0,s.allowance-s.allowSpent);let fc=Math.max(0,freeCash()),fp=Math.max(0,freePay()),sum=fc+fp,shareC=sum?Math.min(freeLeft,Math.round(freeLeft*fc/sum)):0,shareP=Math.min(freeLeft-shareC,fp);document.getElementById("home").innerHTML=`
<div class="card"><div class="k">本当に自由に使えるお金</div><div class="big">¥${y(f)}</div><div class="grid2"><div class="mini"><label>💴 現金</label><b class="cash">¥${y(shareC)}</b></div><div class="mini"><label>● PayPay</label><b class="pay">¥${y(shareP)}</b></div></div><div class="note">必要経費として確保した分を除いた、今ほんまに自由に使える金額。</div></div>
<div class="card today"><div class="k">今日使える金額</div><div class="big">¥${y(d.total)}</div><div class="grid2"><div class="mini"><label>💴 現金</label><b class="cash">¥${y(d.cash)}</b></div><div class="mini"><label>● PayPay</label><b class="pay">¥${y(d.pay)}</b></div></div><div class="note">今日はここまで。使った分だけ今日の残りが減り、日付が変わると再計算。</div>${a}</div>
<div class="actions"><button class="action allow" onclick="openEntry('expense','allowance')">💴 小遣いで使う<small>自由な支出</small></button><button class="action nec" onclick="openEntry('expense','necessary')">🧾 必要経費で使う<small>昼食・子ども関係など</small></button></div>
<div class="actions"><button class="action income" onclick="openEntry('income')">＋ 臨時収入<small>小遣い or 必要経費</small></button><button class="action history" onclick="show('history')">▤ 履歴を見る<small>登録した入出金</small></button></div>
<div class="card"><div class="section">必要経費の確保</div><div class="grid2"><div class="mini"><label>現金に残す分</label><b>¥${y(necCashRemain())}</b></div><div class="mini"><label>PayPayに残す分</label><b>¥${y(necPayRemain())}</b></div></div><div class="help">必要経費が不足しても、小遣い予算そのものは減りません。現金は銀行から補充してOK。</div></div>`;document.getElementById("ht").textContent="まじで結局どーなん？";document.getElementById("hd").textContent=`${new Date().getMonth()+1}月${new Date().getDate()}日・残り${D()}日`}
function openEntry(k,p){if(k==="income")purpose="allowance";else purpose=p||"allowance";method="cash";entryAmount="";show(k)}
function entry(k){let inc=k==="income";document.getElementById("ht").textContent=inc?"臨時収入":"支出";document.getElementById("hd").textContent=inc?"入ってきたお金を分類して登録":"使ったお金を分類して登録";document.getElementById(k).innerHTML=`<div class="card"><div class="section">${inc?"何のお金？":"何に使った？"}</div><div class="opts"><button class="opt ${purpose==="allowance"?"selc":""}" onclick="purpose='allowance';entry('${k}')">🟢 小遣い</button><button class="opt ${purpose==="necessary"?"selp":""}" onclick="purpose='necessary';entry('${k}')">🟠 必要経費</button></div><div class="formlabel">${inc?"どこに入った？":"どこから払った？"}</div><div class="opts"><button class="opt ${method==="cash"?"selc":""}" onclick="method='cash';entry('${k}')">💴 現金</button><button class="opt ${method==="paypay"?"selp":""}" onclick="method='paypay';entry('${k}')">● PayPay</button></div><div class="formlabel">金額</div><input id="${k}amt" class="amount" type="number" inputmode="numeric" min="0" placeholder="0" value="${entryAmount}"><button class="primary" onclick="register('${k}')">${inc?"＋ 登録する":"− 登録する"}</button><button class="secondary" onclick="show('home')">キャンセル</button><div class="help">「小遣い/必要経費」と「現金/PayPay」は別々に管理します。</div></div>`;let inp=document.getElementById(k+"amt");inp.addEventListener("input",()=>entryAmount=inp.value)}
function register(k){let n=Number(document.getElementById(k+"amt").value);if(!n||n<0){toast("金額を入力してください");return}resetDay();if(k==="expense"){if(method==="cash")s.cash-=n;else s.paypay-=n;if(purpose==="allowance"){s.allowSpent+=n;if(method==="cash")s.todayCashSpent+=n;else s.todayPaySpent+=n}else{if(method==="cash")s.necCashSpent+=n;else s.necPaySpent+=n}s.events.unshift({date:td(),type:"支出",purpose,method,amount:n})}else{if(method==="cash")s.cash+=n;else s.paypay+=n;s.events.unshift({date:td(),type:"収入",purpose,method,amount:n});if(purpose==="allowance"){s.allowance+=n;let r=D();s.baseTotal=Math.floor(Math.max(0,freeRemain())/r);let c=Math.floor(Math.max(0,freeCash())/r),p=Math.floor(Math.max(0,freePay())/r),df=s.baseTotal-c-p;if(df>0){if(freePay()>=freeCash())p+=df;else c+=df}s.baseCash=c;s.basePay=p}else{if(method==="cash")s.necAdjustTotal+=n;else s.necAdjustPay+=n}}save();toast("登録しました");setTimeout(()=>show("home"),300)}
function settings(){if(!monthGate())return;document.getElementById("ht").textContent="設定";document.getElementById("hd").textContent="今月の予算と現在の残高";document.getElementById("settings").innerHTML=`<div class="card"><div class="section">今月の予算</div><div class="setting"><span>小遣い予算</span><span class="badge">¥${y(s.allowance)}</span></div><div class="setting"><span>必要経費 合計</span><span class="badge">¥${y(s.necessary)}</span></div><div class="setting"><span>PayPay必要経費</span><span class="badge">¥${y(s.payNecessary)}</span></div><div class="help">月の途中で予算そのものを変更せず、必要経費の残りだけ調整できます。</div></div><div class="card"><div class="section">今月の残り必要経費</div><div class="setting"><span>必要経費 合計の残り</span><input id="rt" type="number" value="${Math.max(0,necBaseTotal())}"></div><div class="setting"><span>PayPay必要経費の残り</span><input id="rp" type="number" value="${Math.max(0,necBasePay())}"></div><div class="setting"><span>現金必要経費の残り</span><span class="badge">自動 ¥${y(necCashRemain())}</span></div><div class="help">例：PayPayのお弁当代が残り1,750円なら、ここを1,750円に変更。今月の予算額そのものは変わりません。</div><button class="secondary" onclick="saveRemainSet()">残り必要経費を更新</button></div><div class="card"><div class="section">現在の残高</div><div class="setting"><span>現金</span><input id="c" type="number" value="${s.cash}"></div><div class="setting"><span>PayPay</span><input id="pp" type="number" value="${s.paypay}"></div><div class="help">財布とPayPayを実際に確認して入力します。</div></div><div class="card"><button class="primary" onclick="saveBalanceSet()">残高を保存</button><button class="secondary" onclick="hardReset()">初回状態にリセット</button></div>`}
function saveRemainSet(){let total=Math.max(0,Number(document.getElementById("rt").value)||0),pay=Math.max(0,Number(document.getElementById("rp").value)||0);if(pay>total){toast("PayPay残りは必要経費合計を超えられません");return}s.necAdjustTotal=total-(s.necessary-s.necCashSpent-s.necPaySpent);s.necAdjustPay=pay-(s.payNecessary-s.necPaySpent);s.baseTotal=s.baseCash=s.basePay=null;save();toast("残り必要経費を更新しました");setTimeout(()=>settings(),300)}
function saveBalanceSet(){s.cash=Number(document.getElementById("c").value)||0;s.paypay=Number(document.getElementById("pp").value)||0;s.baseTotal=s.baseCash=s.basePay=null;save();toast("残高を保存しました");setTimeout(()=>show("home"),300)}
function hardReset(){if(!confirm("すべての記録をリセットしますか？"))return;s=def();save();toast("リセットしました");setTimeout(()=>settings(),300)}
function history(){if(!monthGate())return;document.getElementById("ht").textContent="履歴";document.getElementById("hd").textContent="このアプリに登録した入出金";let e=s.events.slice(0,100);document.getElementById("history").innerHTML=`<div class="card"><div class="section">記録 ${e.length}件</div>${e.length?e.map(x=>`<div class="item"><div>${x.type}・${x.purpose==="allowance"?"小遣い":"必要経費"}・${x.method==="cash"?"現金":"PayPay"}<div class="meta">${x.date}</div></div><div class="${x.type==="収入"?"plus":"minus"}">${x.type==="収入"?"+":"−"}¥${y(x.amount)}</div></div>`).join(""):"<div class='note'>まだ記録はありません。</div>"}</div>`}
function toast(m){let t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1100)}
resetDay();home();
</script></body></html>
