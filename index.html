<style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100dvh}header{background:linear-gradient(135deg,var(--n),var(--n2));color:#fff;padding:17px 17px 15px;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px #123a632e}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:21px;font-weight:850}.date{font-size:12px;opacity:.85;margin-top:4px}.headRight{display:flex;align-items:center;gap:8px}.version{font-size:10px;font-weight:800;opacity:.8;white-space:nowrap}.gear{width:42px;height:42px;border:0;border-radius:12px;background:#ffffff20;color:#fff;font-size:21px}main{padding:14px 14px 94px}.screen{display:none}.screen.active{display:block}.card{background:var(--w);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px #123a6317}.kRow{display:flex;align-items:center;justify-content:space-between;gap:8px}.sideValue{font-size:12px;font-weight:850;color:var(--n);white-space:nowrap}.k{font-size:12px;color:var(--muted);font-weight:750}.big{font-size:36px;font-weight:900;color:var(--n);letter-spacing:-.03em;margin-top:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.mini{background:#f7fafc;border-radius:13px;padding:10px}.mini label{display:block;font-size:11px;color:var(--muted)}.mini b{display:block;font-size:18px;margin-top:2px}.cash{color:var(--c)}.pay{color:var(--p)}.note,.help{font-size:11px;color:var(--muted);line-height:1.55;margin-top:7px}.today{background:#eaf3fb;border-color:#cfe2f2}.today .big{font-size:34px}.todaySpent{margin-top:10px;padding-top:9px;border-top:1px solid #cfe2f2;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}.todaySpent b{font-size:15px;color:var(--ink)}.alert{margin-top:10px;background:#fff0f0;border:1px solid #efb8b8;color:var(--d);border-radius:13px;padding:9px 11px;font-size:12px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.action{min-height:70px;border:0;border-radius:17px;color:#fff;font-weight:850;padding:12px;box-shadow:0 7px 18px #123a6320}.action small{display:block;font-size:11px;margin-top:4px;opacity:.9}.allow{background:var(--c)}.nec{background:var(--o)}.income{background:var(--n)}.transfer{background:#496d8e}.history{background:#6f8192}.section{font-size:17px;font-weight:850;margin-bottom:10px}.formlabel{font-size:12px;color:var(--muted);font-weight:750;margin:14px 0 7px}.amount{width:100%;padding:13px;border:2px solid var(--line);border-radius:14px;font-size:28px;font-weight:850;color:var(--n)}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.three{grid-template-columns:1fr 1fr 1fr}.opt{padding:13px;border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:800}.opt.allowSel{border-color:var(--c);background:#effaf6}.opt.necSel{border-color:var(--o);background:#fff6e9}.opt.paySel{border-color:var(--p);background:#fff1f6}.primary{width:100%;margin-top:16px;padding:15px;border:0;border-radius:15px;background:var(--n);color:#fff;font-weight:850}.secondary{width:100%;margin-top:9px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--n);font-weight:800}.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.setting:last-child{border:0}.setting input{width:145px;text-align:right;border:1px solid var(--line);border-radius:10px;padding:8px}.badge{font-size:11px;font-weight:800;background:#edf3f8;color:var(--n);padding:4px 8px;border-radius:99px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 7px max(7px,env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:#fff;color:#718194;padding:5px;font-size:12px;font-weight:750}.nav button.on{color:var(--n)}.ico{display:block;font-size:19px;margin-bottom:1px}.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.item:last-child{border:0}.meta{font-size:10px;color:var(--muted);margin-top:3px}.minus{color:var(--d);font-weight:850}.negative{color:var(--d)!important}.plus{color:var(--c);font-weight:850}.move{color:var(--n);font-weight:850}.modalBack{display:none;position:fixed;inset:0;background:#00000055;z-index:40;align-items:flex-end;justify-content:center;padding:14px}.modal{width:min(520px,100%);background:#fff;border-radius:18px;padding:18px;box-shadow:0 12px 40px #0003}.modalTitle{font-size:17px;font-weight:900;color:var(--d)}.modalText{font-size:13px;line-height:1.6;margin-top:8px;color:var(--ink)}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.modalBtns button{padding:13px;border-radius:13px;font-weight:850;border:1px solid var(--line);background:#fff;color:var(--n)}.modalBtns .moveBtn{background:var(--n);color:#fff;border-color:var(--n)}.toast{display:none;position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#17324d;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;z-index:30;max-width:88%;text-align:center}

<body>
<div class="app">
<header><div class="head"><div><div id="ht" class="title">まじで結局どーなん？</div><div id="hd" class="date"></div></div><div class="headRight"><span class="version">v10</span><button id="ha" class="gear" onclick="openSettings()">⚙︎</button></div></div></header>
<main><section id="home" class="screen active"></section><section id="expense" class="screen"></section><section id="income" class="screen"></section><section id="transfer" class="screen"></section><section id="settings" class="screen"></section><section id="history" class="screen"></section></main>
<nav class="nav"><button id="nh" class="on" onclick="show('home')"><span class="ico">⌂</span>ホーム</button><button id="nr" onclick="show('history')"><span class="ico">▤</span>履歴</button><button id="ns" onclick="openSettings()"><span class="ico">⚙︎</span>設定</button></nav></div>
<div id="toast" class="toast"></div><div id="shortageModal" class="modalBack" onclick="closeShortage(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalTitle">お金が不足しています。</div><div class="modalText">お金の移動、または銀行口座から補填してください。</div><div class="modalBtns"><button class="moveBtn" onclick="chooseShortageMove()">お金を移動する</button><button onclick="chooseShortageBank()">銀行口座から補填する</button></div></div></div>
<script>
const KEY='majide-kekkyoku-v10';
const OLD_KEYS=['majide-kekkyoku-v9','majide-kekkyoku-v8','majide-kekkyoku-v7','majide-kekkyoku-v6','majide-kekkyoku-v5','majide-kekkyoku-v4','majide-kekkyoku-v3','majide-kekkyoku-v1'];
const yen=n=>new Intl.NumberFormat('ja-JP').format(Math.round(Number(n)||0));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monthKey=()=>today().slice(0,7);
const daysInMonth=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const daysLeft=()=>daysInMonth()-new Date().getDate()+1;
const clamp0=n=>Math.max(0,Number(n)||0);
function fresh(){return {version:9,monthKey:monthKey(),budget:{necessary:23000,payNecessary:10000},balance:{cash:5000,paypay:34000},necessaryRemain:{cash:13000,paypay:10000},daily:{date:today(),total:null,cash:null,paypay:null},events:[],monthSetupNeeded:false,pendingBudget:null}}
function oldNecessaryRemains(o){
  const budget=o?.budget||{};
  const necessary=Number(budget.necessary??o?.necessary??23000)||0;
  const payNecessary=Number(budget.payNecessary??o?.payNecessary??10000)||0;
  const spent=o?.spent||{};
  const adjust=o?.adjust||{};
  const spentCash=Number(spent.necCash)||0;
  const spentPay=Number(spent.necPay)||0;
  const adjTotal=Number(adjust.necTotal??o?.necAdjustTotal)||0;
  const adjPay=Number(adjust.necPay??o?.necAdjustPay)||0;
  const pay=payNecessary-spentPay+adjPay;
  const cash=necessary-spentCash-spentPay+adjTotal-pay;
  return {cash,paypay:pay};
}
function migrate(o){
  const n=fresh();
  if(!o||typeof o!=='object')return n;
  n.monthKey=o.monthKey||monthKey();
  n.budget.necessary=clamp0(o.budget?.necessary??o.necessary??23000);
  n.budget.payNecessary=clamp0(o.budget?.payNecessary??o.payNecessary??10000);
  n.balance.cash=Number(o.balance?.cash??o.cash)||0;
  n.balance.paypay=Number(o.balance?.paypay??o.paypay)||0;
  n.events=Array.isArray(o.events)?o.events.slice():[];
  if(o.necessaryRemain){
    n.necessaryRemain.cash=Number(o.necessaryRemain.cash)||0;
    n.necessaryRemain.paypay=Number(o.necessaryRemain.paypay)||0;
  }else{
    n.necessaryRemain=oldNecessaryRemains(o);
  }
  n.daily={date:today(),total:null,cash:null,paypay:null};
  if(n.monthKey!==monthKey()){
    n.monthSetupNeeded=true;
    n.pendingBudget={...n.budget};
  }
  return n;
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw));for(const k of OLD_KEYS){const old=localStorage.getItem(k);if(old){const n=migrate(JSON.parse(old));localStorage.setItem(KEY,JSON.stringify(n));return n}}}catch(e){}return fresh()}
function normalize(x){const n=fresh();Object.assign(n,x||{});n.version=9;n.budget=Object.assign(fresh().budget,x?.budget||{});delete n.budget.allowance;n.balance=Object.assign(fresh().balance,x?.balance||{});n.necessaryRemain=Object.assign(fresh().necessaryRemain,x?.necessaryRemain||{});n.daily=Object.assign(fresh().daily,x?.daily||{});n.events=Array.isArray(x?.events)?x.events:[];if(!x?.necessaryRemain){const r=oldNecessaryRemains(x);n.necessaryRemain=r}return n}
let s=load(),purpose='allowance',method='cash',entryAmount='',moveFrom='allowance-cash',moveTo='paypay-allowance';
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function resetDay(){if(s.daily.date!==today()){s.daily={date:today(),total:null,cash:null,paypay:null};save()}}
function necPayRemain(){return Number(s.necessaryRemain.paypay)||0}
function necCashRemain(){return Number(s.necessaryRemain.cash)||0}
function reservedCash(){return Math.max(0,necCashRemain())}
function reservedPaypay(){return Math.max(0,necPayRemain())}
function freeCash(){return Math.max(0,s.balance.cash-reservedCash())}
function freePaypay(){return Math.max(0,s.balance.paypay-reservedPaypay())}
function freeTotal(){return freeCash()+freePaypay()}
function todayAllowanceSpentTotal(){return todayAllowanceSpent('cash')+todayAllowanceSpent('paypay')}
function bucketLabel(k){return {'allowance-cash':'現金・小遣い','allowance-paypay':'PayPay・小遣い','necessary-cash':'現金・必要経費','necessary-paypay':'PayPay・必要経費'}[k]||k}
function bucketAmount(k){if(k==='allowance-cash')return freeCash();if(k==='allowance-paypay')return freePaypay();if(k==='necessary-cash')return Math.max(0,necCashRemain());if(k==='necessary-paypay')return Math.max(0,necPayRemain());return 0}
function bucketMethod(k){return k.endsWith('-paypay')?'paypay':'cash'}
function bucketPurpose(k){return k.startsWith('necessary')?'necessary':'allowance'}
function todayAllowanceSpent(m){return s.events.filter(e=>e.date===today()&&e.type==='支出'&&e.purpose==='allowance'&&e.method===m).reduce((a,e)=>a+Number(e.amount||0),0)}
function calculateDailyBase(){const r=daysLeft(),total=freeTotal();if(r<=0)return {baseTotal:total,c:total,p:0};const baseTotal=Math.floor(total/r),sum=freeCash()+freePaypay();let c=sum?Math.floor(baseTotal*freeCash()/sum):0;let p=baseTotal-c;c=Math.min(c,freeCash());p=Math.min(p,freePaypay());let rem=baseTotal-c-p;if(rem>0){const payRoom=freePaypay()-p,cashRoom=freeCash()-c;if(payRoom>=cashRoom)p+=Math.min(rem,payRoom);else c+=Math.min(rem,cashRoom)}return {baseTotal,c,p}}
function ensureDaily(){resetDay();if(s.daily.total!==null)return;const b=calculateDailyBase();s.daily={date:today(),total:b.baseTotal,cash:b.c,paypay:b.p};save()}
function daily(){ensureDaily();const sc=todayAllowanceSpent('cash'),sp=todayAllowanceSpent('paypay');return {total:s.daily.total-sc-sp,cash:s.daily.cash-sc,paypay:s.daily.paypay-sp}}
function reallocateDaily(){s.daily={date:today(),total:null,cash:null,paypay:null};ensureDaily()}
function tomorrowDaily(){const r=daysLeft()-1;return r>0?Math.floor(freeTotal()/r):0}
function monthReady(){if(s.monthKey===monthKey()&&!s.monthSetupNeeded)return true;if(s.monthKey!==monthKey()&&!s.monthSetupNeeded){s.monthSetupNeeded=true;s.pendingBudget={...s.budget};save()}renderMonthSetup();return false}
function renderMonthSetup(){const m=new Date().getMonth()+1,b=s.pendingBudget||s.budget;document.getElementById('home').classList.add('active');document.getElementById('home').innerHTML=`<div class="card"><div class="section">${m}月の設定</div><div class="help">新しい月です。必要経費として確保する金額を確認してください。変更がなければ、そのまま開始できます。</div><div class="setting"><span>必要経費 合計</span><input id="newN" type="number" min="0" value="${b.necessary}"></div><div class="setting"><span>PayPay必要経費</span><input id="newP" type="number" min="0" value="${b.payNecessary}"></div><div class="help">小遣い予算はありません。実際に残っている小遣いを、そのまま自由に使えるお金として管理します。</div><button class="primary" onclick="startMonth()">${m}月を開始する</button></div>`;document.getElementById('ht').textContent='まじで結局どーなん？';document.getElementById('hd').textContent='今月の設定が必要です';document.getElementById('ha').style.display='none'}
function startMonth(){const n=clamp0(document.getElementById('newN').value),p=clamp0(document.getElementById('newP').value);if(p>n){toast('PayPay必要経費は必要経費合計を超えられません');return}s.monthKey=monthKey();s.budget={necessary:n,payNecessary:p};s.necessaryRemain={cash:n-p,paypay:p};s.daily={date:today(),total:null,cash:null,paypay:null};s.monthSetupNeeded=false;s.pendingBudget=null;save();home()}
function show(id){if(id!=='home'&&!monthReady())return;['home','expense','income','transfer','settings','history'].forEach(x=>document.getElementById(x).classList.remove('active'));document.getElementById(id).classList.add('active');['nh','nr','ns'].forEach(x=>document.getElementById(x).classList.remove('on'));const nav={home:'nh',history:'nr',settings:'ns'}[id];if(nav)document.getElementById(nav).classList.add('on');document.getElementById('ha').style.display=(id==='home'||id==='history')?'block':'none';if(id==='home')home();if(id==='expense')entry('expense');if(id==='income')entry('income');if(id==='transfer')transferForm();if(id==='settings')settings();if(id==='history')history()}
function openSettings(){show('settings')}
function home(){if(!monthReady())return;resetDay();const d=daily(),f=freeTotal(),totalMoney=(Number(s.balance.cash)||0)+(Number(s.balance.paypay)||0),sum=freeCash()+freePaypay();let dc=0,dp=0;if(sum>0&&f>0){dc=Math.min(freeCash(),Math.round(f*freeCash()/sum));dp=f-dc;if(dp>freePaypay()){dp=freePaypay();dc=f-dp}if(dc>freeCash()){dc=freeCash();dp=f-dc}}const tomorrow=tomorrowDaily();document.getElementById('home').innerHTML=`<div class="card"><div class="kRow"><div class="k">本当に自由に使えるお金</div><div class="sideValue">総額 ¥${yen(totalMoney)}</div></div><div class="big">¥${yen(f)}</div><div class="grid2"><div class="mini"><label>💴 現金</label><b class="cash">¥${yen(dc)}</b></div><div class="mini"><label>● PayPay</label><b class="pay">¥${yen(dp)}</b></div></div></div><div class="card today"><div class="kRow"><div class="k">今日使える金額</div><div class="sideValue">明日は¥${yen(tomorrow)}使える予定</div></div><div class="big">¥${yen(d.total)}</div><div class="grid2"><div class="mini"><label>💴 現金</label><b class="cash">¥${yen(d.cash)}</b></div><div class="mini"><label>● PayPay</label><b class="pay">¥${yen(d.paypay)}</b></div></div><div class="todaySpent">今日使った小遣い <b>¥${yen(todayAllowanceSpentTotal())}</b></div>${d.total<0?`<div class="alert">使いすぎです。明日以降は1日 ¥${yen(tomorrow)} になります。</div>`:''}</div><div class="actions"><button class="action allow" onclick="openEntry('expense','allowance')">💴 小遣いで使う<small>自由な支出</small></button><button class="action nec" onclick="openEntry('expense','necessary')">🧾 必要経費で使う<small>昼食・子ども関係など</small></button></div><div class="actions"><button class="action income" onclick="openEntry('income')">＋ 臨時収入<small>小遣い or 必要経費</small></button><button class="action transfer" onclick="openTransfer()">↔ お金を移動<small>袋から袋へ移す</small></button></div><div class="actions"><button class="action history" onclick="show('history')">▤ 履歴を見る<small>登録した入出金・移動</small></button><button class="action history" onclick="openSettings()">⚙︎ 設定<small>必要経費・残高を調整</small></button></div><div class="card"><div class="section">必要経費の確保</div><div class="grid2"><div class="mini"><label>現金に残す分</label><b class="${necCashRemain()<0?'negative':'cash'}">${necCashRemain()<0?'−':''}¥${yen(Math.abs(necCashRemain()))}</b></div><div class="mini"><label>PayPayに残す分</label><b class="${necPayRemain()<0?'negative':'pay'}">${necPayRemain()<0?'−':''}¥${yen(Math.abs(necPayRemain()))}</b></div></div>${necCashRemain()<0||necPayRemain()<0?`<div class="alert">${necessaryDeficitText()}</div>`:''}<div class="help">現金とPayPayは別々の袋です。一方の残りで、もう一方の不足を相殺しません。</div></div>`;document.getElementById('ht').textContent='まじで結局どーなん？';document.getElementById('hd').textContent=`${new Date().getMonth()+1}月${new Date().getDate()}日・残り${daysLeft()}日`}
function necessaryDeficitText(){const a=[],c=necCashRemain(),p=necPayRemain();if(c<0)a.push('現金の必要経費が¥'+yen(Math.abs(c))+'不足');if(p<0)a.push('PayPayの必要経費が¥'+yen(Math.abs(p))+'不足');return a.join('、')+'しています。'}
function openEntry(k,p){purpose=k==='income'?'allowance':(p||'allowance');method='cash';entryAmount='';show(k)}
function entry(k){const inc=k==='income';document.getElementById('ht').textContent=inc?'臨時収入':'支出';document.getElementById('hd').textContent=inc?'入ってきたお金を分類して登録':'使ったお金を分類して登録';document.getElementById(k).innerHTML=`<div class="card"><div class="section">${inc?'何のお金？':'何に使った？'}</div><div class="opts"><button class="opt ${purpose==='allowance'?'allowSel':''}" onclick="selectPurpose('${k}','allowance')">🟢 小遣い</button><button class="opt ${purpose==='necessary'?'necSel':''}" onclick="selectPurpose('${k}','necessary')">🟠 必要経費</button></div><div class="formlabel">${inc?'どこに入った？':'どこから払った？'}</div><div class="opts"><button class="opt ${method==='cash'?'allowSel':''}" onclick="selectMethod('${k}','cash')">💴 現金</button><button class="opt ${method==='paypay'?'paySel':''}" onclick="selectMethod('${k}','paypay')">● PayPay</button></div><div class="formlabel">金額</div><input id="${k}amt" class="amount" type="number" inputmode="numeric" min="1" placeholder="0" value="${entryAmount}"><button class="primary" onclick="register('${k}')">${inc?'＋ 登録する':'− 登録する'}</button><button class="secondary" onclick="show('home')">キャンセル</button><div class="help">①目的 → ②現金/PayPay → ③金額 → ④保存。</div></div>`;const input=document.getElementById(k+'amt');input.addEventListener('input',()=>entryAmount=input.value)}
function selectPurpose(k,p){const input=document.getElementById(k+'amt');if(input)entryAmount=input.value;purpose=p;entry(k)}
function selectMethod(k,m){const input=document.getElementById(k+'amt');if(input)entryAmount=input.value;method=m;entry(k)}
function register(k){
  const input=document.getElementById(k+'amt'),n=Math.floor(Number(input?.value));
  if(!Number.isFinite(n)||n<=0){toast('金額を入力してください');return}
  resetDay();
  if(k==='expense'){
    if(purpose==='allowance'){
      const avail=method==='cash'?freeCash():freePaypay();
      if(n>avail){showShortageModal('allowance',method,n);return}
      if(method==='cash')s.balance.cash-=n;else s.balance.paypay-=n;
    }else{
      const remain=method==='cash'?necCashRemain():necPayRemain();
      const balance=method==='cash'?Number(s.balance.cash)||0:Number(s.balance.paypay)||0;
      if(n>remain||n>balance){showShortageModal('necessary',method,n);return}
      if(method==='cash'){s.balance.cash-=n;s.necessaryRemain.cash-=n}
      else{s.balance.paypay-=n;s.necessaryRemain.paypay-=n}
    }
    s.events.unshift({date:today(),type:'支出',purpose,method,amount:n});
  }else{
    if(method==='cash')s.balance.cash+=n;else s.balance.paypay+=n;
    if(purpose==='necessary'){
      if(method==='cash')s.necessaryRemain.cash+=n;else s.necessaryRemain.paypay+=n;
    }
    s.events.unshift({date:today(),type:'収入',purpose,method,amount:n});
  }
  save();entryAmount='';reallocateDaily();toast('登録しました');setTimeout(()=>show('home'),250)
}
let shortageInfo=null;
function showShortageModal(p,m,n){shortageInfo={purpose:p,method:m,amount:n};document.getElementById('shortageModal').style.display='flex'}
function closeShortage(e){if(e.target.id==='shortageModal')closeShortageModal()}
function closeShortageModal(){document.getElementById('shortageModal').style.display='none';shortageInfo=null}
function chooseShortageMove(){if(!shortageInfo)return;const x=shortageInfo;closeShortageModal();moveFrom=x.purpose==='allowance'?(x.method==='cash'?'necessary-cash':'necessary-paypay'):(x.method==='cash'?'allowance-cash':'allowance-paypay');moveTo=x.purpose==='allowance'?(x.method==='cash'?'allowance-cash':'allowance-paypay'):(x.method==='cash'?'necessary-cash':'necessary-paypay');entryAmount='';show('transfer')}
function chooseShortageBank(){closeShortageModal();show('home')}

function openTransfer(){moveFrom='allowance-cash';moveTo='allowance-paypay';entryAmount='';show('transfer')}
function transferForm(){document.getElementById('ht').textContent='お金を移動';document.getElementById('hd').textContent='袋から袋へ、お金の居場所を変えます';const opts=[['allowance-cash','現金・小遣い'],['allowance-paypay','PayPay・小遣い'],['necessary-cash','現金・必要経費'],['necessary-paypay','PayPay・必要経費']];document.getElementById('transfer').innerHTML=`<div class="card"><div class="section">移動元</div><div class="opts">${opts.map(([k,l])=>`<button class="opt ${moveFrom===k?'allowSel':''}" onclick="selectMoveFrom('${k}')">${l}<small style="display:block;margin-top:4px;color:var(--muted)">残り ¥${yen(bucketAmount(k))}</small></button>`).join('')}</div><div class="formlabel">移動先</div><div class="opts">${opts.map(([k,l])=>`<button class="opt ${moveTo===k?'paySel':''}" onclick="selectMoveTo('${k}')">${l}</button>`).join('')}</div><div class="formlabel">金額</div><input id="transferAmt" class="amount" type="number" inputmode="numeric" min="1" placeholder="0" value="${entryAmount}"><button class="primary" onclick="registerTransfer()">↔ 移動する</button><button class="secondary" onclick="show('home')">キャンセル</button><div class="help">移動では、あなたのお金の総額は変わりません。現金/PayPayや小遣い/必要経費の「入っている袋」だけが変わります。</div></div>`;document.getElementById('transferAmt').addEventListener('input',()=>entryAmount=document.getElementById('transferAmt').value)}
function selectMoveFrom(k){moveFrom=k;transferForm()}
function selectMoveTo(k){moveTo=k;transferForm()}
function registerTransfer(){
  const n=Math.floor(Number(document.getElementById('transferAmt')?.value));
  if(moveFrom===moveTo){toast('移動元と移動先を別にしてください');return}
  if(!Number.isFinite(n)||n<=0){toast('金額を入力してください');return}
  const max=bucketAmount(moveFrom);if(n>max){toast('移動元の残高を超えています');return}
  const fm=bucketMethod(moveFrom),tm=bucketMethod(moveTo),fp=bucketPurpose(moveFrom),tp=bucketPurpose(moveTo);
  if(fm==='cash'&&tm==='paypay'){s.balance.cash-=n;s.balance.paypay+=n}
  else if(fm==='paypay'&&tm==='cash'){s.balance.paypay-=n;s.balance.cash+=n}
  if(fp==='allowance'&&tp==='necessary'){
    if(fm==='cash')s.necessaryRemain.cash+=n;else s.necessaryRemain.paypay+=n;
  }else if(fp==='necessary'&&tp==='allowance'){
    if(fm==='cash')s.necessaryRemain.cash-=n;else s.necessaryRemain.paypay-=n;
  }else if(fp==='necessary'&&tp==='necessary'&&fm!==tm){
    if(fm==='cash'){s.necessaryRemain.cash-=n;s.necessaryRemain.paypay+=n}
    else{s.necessaryRemain.paypay-=n;s.necessaryRemain.cash+=n}
  }
  s.events.unshift({date:today(),type:'移動',from:moveFrom,to:moveTo,amount:n});
  save();entryAmount='';reallocateDaily();toast(bucketLabel(moveFrom)+' → '+bucketLabel(moveTo)+' に ¥'+yen(n)+' 移動しました');setTimeout(()=>show('home'),250)
}
function settings(){if(!monthReady())return;document.getElementById('ht').textContent='設定';document.getElementById('hd').textContent='必要経費と現在の残高';document.getElementById('settings').innerHTML=`<div class="card"><div class="section">必要経費の残高</div><div class="setting"><span>現金必要経費の残り</span><input id="rc" type="number" value="${necCashRemain()}"></div><div class="setting"><span>PayPay必要経費の残り</span><input id="rp" type="number" value="${necPayRemain()}"></div><div class="setting"><span>必要経費の残り合計</span><span class="badge">¥${yen(necCashRemain()+necPayRemain())}</span></div><div class="help">「これから必要経費として確保しておきたい金額」です。予定が変わったら、いつでも変更できます。変更すると自由に使えるお金と今日使える金額に即時反映されます。現金とPayPayは別々に管理し、相殺しません。</div><button class="secondary" onclick="saveRemainSet()">必要経費残高を更新</button></div><div class="card"><div class="section">現在の残高</div><div class="setting"><span>現金</span><input id="c" type="number" min="0" value="${s.balance.cash}"></div><div class="setting"><span>PayPay</span><input id="pp" type="number" min="0" value="${s.balance.paypay}"></div><div class="help">財布とPayPayの実際の残高です。ここを変更すると、今日使える金額も再計算します。</div><button class="primary" onclick="saveBalanceSet()">残高を保存</button></div><div class="card"><button class="secondary" onclick="hardReset()">初回状態にリセット</button></div>`}
function updateBudgetTotal(){const c=Math.max(0,Number(document.getElementById('bc')?.value)||0),p=Math.max(0,Number(document.getElementById('bp')?.value)||0);const el=document.getElementById('budgetTotal');if(el)el.textContent='¥'+yen(c+p)}


function saveRemainSet(){const c=Number(document.getElementById('rc').value),p=Number(document.getElementById('rp').value);if(!Number.isFinite(c)||!Number.isFinite(p)){toast('必要経費残高を正しく入力してください');return}s.necessaryRemain.cash=c;s.necessaryRemain.paypay=p;s.daily={date:today(),total:null,cash:null,paypay:null};save();reallocateDaily();toast('必要経費残高を更新しました');setTimeout(()=>show('home'),250)}
function saveBalanceSet(){const c=Number(document.getElementById('c').value),p=Number(document.getElementById('pp').value);if(!Number.isFinite(c)||c<0||!Number.isFinite(p)||p<0){toast('残高を正しく入力してください');return}s.balance.cash=c;s.balance.paypay=p;s.daily={date:today(),total:null,cash:null,paypay:null};save();toast('残高を保存しました');setTimeout(()=>show('home'),250)}
function hardReset(){if(!confirm('すべての記録と設定をリセットしますか？'))return;s=fresh();save();toast('リセットしました');setTimeout(()=>show('settings'),250)}
function history(){document.getElementById('ht').textContent='履歴';document.getElementById('hd').textContent='このアプリに登録した入出金・お金の移動';const e=s.events.slice(0,100);document.getElementById('history').innerHTML=`<div class="card"><div class="section">記録 ${e.length}件</div>${e.length?e.map(x=>{if(x.type==='移動')return `<div class="item"><div>移動・${bucketLabel(x.from)} → ${bucketLabel(x.to)}<div class="meta">${x.date}</div></div><div class="move">↔ ¥${yen(x.amount)}</div></div>`;return `<div class="item"><div>${x.type}・${x.purpose==='allowance'?'小遣い':'必要経費'}・${x.method==='cash'?'現金':'PayPay'}<div class="meta">${x.date}</div></div><div class="${x.type==='収入'?'plus':'minus'}">${x.type==='収入'?'+':'−'}¥${yen(x.amount)}</div></div>`}).join(''):'<div class="note">まだ記録はありません。</div>'}</div>`}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',1800)}
resetDay();if(s.monthKey!==monthKey()){s.monthKey=monthKey();s.monthSetupNeeded=false;s.pendingBudget=null;s.daily={date:today(),total:null,cash:null,paypay:null};save()}home();
</script>
</body>
</html>
